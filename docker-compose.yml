version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: coffee_tracker_db
    environment:
      POSTGRES_USER: coffee_user
      POSTGRES_PASSWORD: coffee_pass
      POSTGRES_DB: coffee_tracker
    ports:
      - '55432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
