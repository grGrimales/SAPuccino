<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>SAPuccino - Coffee Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Cliente SignalR para atualização em tempo real (via CDN). -->
    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>

    <script
        id="sap-ui-bootstrap"
        src="https://ui5.sap.com/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resource-roots='{"sapuccino": "./"}'
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-libs="sap.m,sap.ui.layout,sap.suite.ui.microchart">
    </script>
</head>
<body class="sapUiBody">
    <div
        data-sap-ui-component
        data-name="sapuccino"
        data-id="container"
        data-settings='{"id": "sapuccino"}'>
    </div>
</body>
</html>
